[tool.pytest.ini_options]
# --ds on the command line wins over the DJANGO_SETTINGS_MODULE env var from .env,
# so tests always use the test settings.
addopts = "--ds=config.settings.test -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy passwords are fine in tests
